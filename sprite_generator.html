<!DOCTYPE html>
<html>
<head>
<title>Neon Placeholder Sprite Generator</title>
<style>
    body { background:#111; color:white; font-family:monospace; padding:20px; }
    canvas { image-rendering: pixelated; border:1px solid #444; margin:10px 0; }
    button { padding:8px 14px; margin:5px; background:#0ff; border:none; cursor:pointer; }
    h2 { color:#0ff; margin-top:40px; }
</style>
</head>
<body>

<h1>Neon Placeholder Sprite Generator</h1>
<p>Click any button to generate and download a 64×64 neon cyan placeholder sprite.</p>

<div id="sections"></div>
<canvas id="c" width="64" height="64"></canvas>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const OUTLINE = "#00ffff";
const FILL = "#000000";

// Utility: draw silhouette rectangles
function drawFill(rects) {
    ctx.fillStyle = FILL;
    rects.forEach(r => ctx.fillRect(r[0], r[1], r[2], r[3]));
}

// Utility: draw neon outline
function drawOutline(rects) {
    ctx.strokeStyle = OUTLINE;
    ctx.lineWidth = 2;
    rects.forEach(r => ctx.strokeRect(r[0], r[1], r[2], r[3]));
}

// Export PNG
function downloadPNG(name) {
    const link = document.createElement("a");
    link.download = name + ".png";
    link.href = canvas.toDataURL();
    link.click();
}

// ANIMATION DATA
// -----------------------------

// Laser (3 frames)

// Portal (4 frames)
const portal = [

// -----------------------------
// UI GENERATION
// -----------------------------

function addSection(title, frames, prefix) {
    const container = document.getElementById("sections");
    const h = document.createElement("h2");
    h.textContent = title;
    container.appendChild(h);

    frames.forEach((frame, i) => {
        const btn = document.createElement("button");
        btn.textContent = `${prefix}_${i}`;
        btn.onclick = () => {
            ctx.clearRect(0, 0, 64, 64);
            drawFill(frame);
            drawOutline(frame);
            downloadPNG(`${prefix}_${i}`);
        };
        container.appendChild(btn);
    });
}

// Add grouped sections
addSection("Idle", idle, "idle");
addSection("Run", run, "run");
addSection("Jump", jump, "jump");
addSection("Fall", fall, "fall");
addSection("Attack", attack, "attack");
addSection("Parry", parry, "parry");
addSection("Finisher", finisher, "finisher");
addSection("Shuriken", shuriken, "shuriken");

// Laser (special)
{
    const container = document.getElementById("sections");
    const h = document.createElement("h2");
    h.textContent = "Laser";
    container.appendChild(h);

    ["start", "mid", "end"].forEach(name => {
        const btn = document.createElement("button");
        btn.textContent = `laser_${name}`;
        btn.onclick = () => {
            ctx.clearRect(0, 0, 64, 64);
            drawFill(laser[name]);
            drawOutline(laser[name]);
            downloadPNG(`laser_${name}`);
        };

}
